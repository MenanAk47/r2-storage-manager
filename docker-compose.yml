# ==============================================================================
# Cloudflare R2 Storage Manager - Docker Compose Setup
# ==============================================================================
# Quick Start:
# 1. Copy '.env.example' to '.env' and fill in your Cloudflare R2 credentials.
# 2. Run: docker compose up -d
# 3. Open: http://localhost:3000
# ==============================================================================

services:
  r2-storage-manager:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: r2-storage-manager
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      - CLOUDFLARE_ACCOUNT_ID=${CLOUDFLARE_ACCOUNT_ID}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME}
      - R2_JURISDICTION=${R2_JURISDICTION:-}
      - R2_PUBLIC_URL=${R2_PUBLIC_URL:-}
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:-admin}
      - SESSION_SECRET=${SESSION_SECRET:-}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/auth/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
